name: Build and Release CyberWall

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore Dependencies
        run: dotnet restore CyberWall.slnx

      - name: Build Solution
        run: dotnet build CyberWall.slnx --configuration Release --no-restore

      - name: Publish Win-x64 Application
        run: |
          dotnet publish src/CyberWall.UI/CyberWall.UI.csproj -c Release -r win-x64 --self-contained true -o ./publish-win64
          dotnet publish src/CyberWall.Service/CyberWall.Service.csproj -c Release -r win-x64 --self-contained true -o ./publish-win64

      - name: Copy Extra Installer Assets
        shell: powershell
        run: |
          if (Test-Path installer/install.ps1) {
            Copy-Item installer/install.ps1 ./publish-win64/
          }
          if (-not (Test-Path ./publish-win64/Assets)) {
            New-Item -ItemType Directory -Force -Path ./publish-win64/Assets | Out-Null
          }
          if (Test-Path src/CyberWall.UI/Assets/CyberWall.ico) {
            Copy-Item src/CyberWall.UI/Assets/CyberWall.ico ./publish-win64/Assets/
            Copy-Item src/CyberWall.UI/Assets/CyberWall.ico ./publish-win64/
          }

      - name: Zip Published Output (Portable)
        shell: powershell
        run: |
          Compress-Archive -Path ./publish-win64/* -DestinationPath ./CyberWall-${{ github.ref_name }}-Portable-win-x64.zip

      - name: Compile Inno Setup Installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion="${{ github.ref_name }}" CyberWall.iss

      - name: Prepare Release Notes & Scan with VirusTotal
        id: virustotal
        shell: powershell
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $installerPath = "./CyberWall-Setup-${{ github.ref_name }}.exe"
          $portablePath = "./CyberWall-${{ github.ref_name }}-Portable-win-x64.zip"

          $installerHash = (Get-FileHash $installerPath -Algorithm SHA256).Hash.ToLower()
          $portableHash = (Get-FileHash $portablePath -Algorithm SHA256).Hash.ToLower()

          Write-Host "Installer SHA256: $installerHash"
          Write-Host "Portable SHA256: $portableHash"

          if ($env:VIRUSTOTAL_API_KEY) {
            Write-Host "Uploading installer to VirusTotal..."
            try {
              $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
              $form = @{ file = Get-Item $installerPath }
              $res = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files" -Method Post -Headers $headers -Form $form -TimeoutSec 180
              Write-Host "Installer uploaded successfully. Analysis ID: $($res.data.id)"
            } catch {
              Write-Warning "VirusTotal installer upload warning: $_"
            }

            Write-Host "Uploading portable archive to VirusTotal..."
            try {
              $headers = @{ "x-apikey" = $env:VIRUSTOTAL_API_KEY }
              $form = @{ file = Get-Item $portablePath }
              $res = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files" -Method Post -Headers $headers -Form $form -TimeoutSec 180
              Write-Host "Portable archive uploaded successfully. Analysis ID: $($res.data.id)"
            } catch {
              Write-Warning "VirusTotal portable upload warning: $_"
            }
          } else {
            Write-Host "VIRUSTOTAL_API_KEY secret not found; skipping direct upload and using computed SHA256 hashes for reports."
          }

          $lines = @(
            "## 🛡️ CyberWall ${{ github.ref_name }} — Release Notes",
            "",
            "Welcome to the official **CyberWall ${{ github.ref_name }}** release! CyberWall is a high-performance, real-time application-layer firewall powered by the Windows Filtering Platform (WFP) kernel engine.",
            "",
            "---",
            "",
            "### ✨ Key Features & Highlights",
            "",
            "- 🌊 **Adaptive Live Telemetry Stream**:",
            "  - Real-time network speed monitoring with auto-calibrated bandwidth scaling.",
            "  - Dynamic particle density and velocity that smoothly reflects live connection saturation.",
            "  - Configurable visual animation modes (*Fluid Stream*, *Glow Pulse*, or *Static*).",
            "",
            "- 🔍 **Application Info & Modification Monitor (GlassWire Style)**:",
            "  - Real-time detection and alerts when applications change version or executable binaries are modified.",
            "  - Intelligent semantic versioning and build metadata sanitization.",
            "",
            "- 🚨 **On-Screen Pop-up Alerts & Granular Settings**:",
            "  - On-screen alerts for Internet disconnected/restored, Protection state changes, and Auto-block events.",
            "  - Dedicated toggle switches in Settings to customize exactly which notifications appear.",
            "",
            "- 🎨 **Modern Fluent UI & Multi-Theme Engine**:",
            "  - 🌌 **CyberWall**: Signature Cyber Navy with radiant Neon Cyan accents.",
            "  - 🌑 **Dark**: Neutral Charcoal with deep Indigo tones.",
            "  - ☀️ **Light**: Crisp Slate with Royal Blue accents.",
            "  - Themed sleek custom scrollbars across all windows and dialogs.",
            "",
            "- ⚡ **WFP Kernel-Level Per-App Filtering**:",
            "  - Real-time packet interception with ultra-low latency.",
            "  - Strict Block, Allow, and Interactive Prompt modes with inbound/outbound directional control.",
            "",
            "- 📋 **Dedicated Connection Log Viewer**:",
            "  - Real-time event log with instant search filtering by app name, IP, port, and PID.",
            "  - One-click copy, log clearing, and direct file access.",
            "",
            "- 🔄 **Built-in Seamless Auto-Update System**:",
            "  - Integrated GitHub Releases checker with real-time download progress bar.",
            "  - One-click silent installer launch and update workflow.",
            "",
            "- 🌐 **100% Bilingual Interface**:",
            "  - Full native support for **English** and **Spanish**.",
            "",
            "---",
            "",
            "### 📦 Downloads & Packages",
            "",
            "| File | Description | Platform |",
            "| :--- | :--- | :--- |",
            "| **`CyberWall-Setup-${{ github.ref_name }}.exe`** | 🚀 **Recommended Installer** (Inno Setup with Start Menu, Desktop & Auto-Startup options) | Windows 10 / 11 (x64) |",
            "| **`CyberWall-${{ github.ref_name }}-Portable-win-x64.zip`** | 💼 **Portable Archive** (Extract and run with Administrator privileges) | Windows 10 / 11 (x64) |",
            "",
            "---",
            "",
            "### 🔍 VirusTotal Scan Results (70+ Antivirus Engines)",
            "",
            "- 🛡️ **Setup Installer**: [View VirusTotal Inspection Report](https://www.virustotal.com/gui/file/$installerHash)  ",
            "  *(SHA256: ``$installerHash``)*",
            "- 💼 **Portable Archive**: [View VirusTotal Inspection Report](https://www.virustotal.com/gui/file/$portableHash)  ",
            "  *(SHA256: ``$portableHash``)*",
            "",
            "---",
            "",
            "*Crafted with precision by [CyberGems](https://cybergems.org)*"
          )

          [System.IO.File]::WriteAllLines("release_notes.md", $lines)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: "CyberWall ${{ github.ref_name }}"
          files: |
            ./CyberWall-${{ github.ref_name }}-Portable-win-x64.zip
            ./CyberWall-Setup-${{ github.ref_name }}.exe
          draft: true
          prerelease: false
          body_path: ./release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
