name: Build and Test CyberWall

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore CyberWall.slnx

      - name: Build Solution
        run: dotnet build CyberWall.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test CyberWall.slnx --configuration Release --no-build
